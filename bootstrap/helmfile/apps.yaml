---
bases:
  - default.yaml
---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# Bootstraps core applications that provide a minimal runtime base for the
# cluster. These releases are installed first so the cluster has the resources
# Flux needs before its own reconciliation begins.

helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true

releases:
  - name: cilium
    namespace: kube-system
    inherit:
      - template: default
    hooks:
      - # Wait for CRDs to be available
        command: kubectl
        args:
          - wait
          - --for=create
          - crd/ciliumloadbalancerippools.cilium.io
          - crd/ciliuml2announcementpolicies.cilium.io
          - --timeout=2m
        events:
          - postsync
        showlogs: true
      - # Apply Resources
        command: kubectl
        args:
          - apply
          - --namespace={{ .Release.Namespace }}
          - --server-side
          - --force-conflicts
          - --filename=../../kubernetes/apps/{{ .Release.Namespace }}/{{ .Release.Name }}/app/networking.yaml
        events:
          - postsync
        showlogs: true

  - name: coredns
    namespace: kube-system
    inherit:
      - template: default
    needs:
      - kube-system/cilium

  - name: cert-manager
    namespace: cert-manager
    inherit:
      - template: default
    needs:
      - kube-system/coredns

  - name: external-secrets
    namespace: external-secrets
    inherit:
      - template: default
    needs:
      - cert-manager/cert-manager

  - name: onepassword
    namespace: external-secrets
    inherit:
      - template: default
    hooks:
      - # Wait for CRDs to be available
        command: kubectl
        args:
          - wait
          - --for=create
          - crd/clustersecretstores.external-secrets.io
          - --timeout=2m
        events:
          - postsync
        showlogs: true
      - # Apply Resources
        command: kubectl
        args:
          - apply
          - --server-side
          - --force-conflicts
          - --filename=../../kubernetes/apps/{{ .Release.Namespace }}/{{ .Release.Name }}/app/clustersecretstore.yaml
        events:
          - postsync
        showlogs: true
    needs:
      - external-secrets/external-secrets

  - name: flux-operator
    namespace: flux-system
    inherit:
      - template: default
    needs:
      - external-secrets/onepassword

  - name: flux-instance
    namespace: flux-system
    inherit:
      - template: default
    needs:
      - flux-system/flux-operator
