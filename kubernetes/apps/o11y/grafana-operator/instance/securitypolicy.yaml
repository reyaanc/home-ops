---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: grafana-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana
  oidc:
    provider:
      issuer: https://id.reyaan.dev
    clientID: 392f9c79-1716-43dd-b9ad-7ac7d9dda674
    clientSecret:
      name: grafana-oidc-secret
    scopes: ["openid", "email", "profile", "groups"]
    redirectURL: https://grafana.reyaan.dev/oauth2/callback
    logoutPath: /oauth2/sign_out
    cookieDomain: reyaan.dev
