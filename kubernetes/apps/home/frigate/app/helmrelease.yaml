---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  chartRef:
    kind: OCIRepository
    name: frigate
  interval: 1h
  values:
    controllers:
      frigate:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.17.2
            env:
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: frigate-camera-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 5000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 200m
              limits:
                memory: 4Gi
    defaultPodOptions:
      nodeSelector:
        node.kubernetes.io/gpu: "true"
    service:
      app:
        ports:
          http:
            port: 5000
          rtsp:
            port: 8554
          webrtc:
            port: 8555
    serviceMonitor:
      app:
        endpoints:
          - port: http
            path: /metrics
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.reyaan.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config-file:
        type: configMap
        name: frigate
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
      config:
        type: persistentVolumeClaim
        storageClass: miroir
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /config
      media:
        type: persistentVolumeClaim
        storageClass: miroir-camera
        accessMode: ReadWriteOnce
        size: 3Ti
        globalMounts:
          - path: /media
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /tmp/cache
      # Intel iGPU passthrough
      dri:
        type: hostPath
        hostPath: /dev/dri
        globalMounts:
          - path: /dev/dri
    configMaps:
      configmap:
        data:
          config.yaml: |
            mqtt:
              enabled: false
            auth:
              enabled: false
            detectors:
              ov:
                type: openvino
                device: GPU
            record:
              enabled: True
              continuous:
                days: 3
              motion:
                days: 7
              alerts:
                retain:
                  days: 30
                  mode: motion
              detections:
                retain:
                  days: 30
                  mode: motion
            model:
              width: 300
              height: 300
              input_tensor: nhwc
              input_pixel_format: bgr
              path: /openvino-model/ssdlite_mobilenet_v2.xml
              labelmap_path: /openvino-model/coco_91cl_bkgr.txt
            cameras:
              driveway:
                ffmpeg:
                  inputs:
                    - path: rtsp://{FRIGATE_CAMERA_USERNAME}:{FRIGATE_CAMERA_PASSWORD}@192.168.68.201:554/Streaming/Channels/101
                      roles: [detect, record]
                detect:
                  width: 1280
                  height: 720
              lawn:
                ffmpeg:
                  inputs:
                    - path: rtsp://{FRIGATE_CAMERA_USERNAME}:{FRIGATE_CAMERA_PASSWORD}@192.168.68.202:554/Streaming/Channels/101
                      roles: [detect, record]
                detect:
                  width: 1280
                  height: 720
              top:
                ffmpeg:
                  inputs:
                    - path: rtsp://{FRIGATE_CAMERA_USERNAME}:{FRIGATE_CAMERA_PASSWORD}@192.168.68.203:554/Streaming/Channels/101
                      roles: [detect, record]
                detect:
                  width: 1280
                  height: 720