---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: copyparty-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: copyparty
  oidc:
    provider:
      issuer: https://id.reyaan.dev
    clientID: e52c8154-4ba7-46a5-96c6-180954012404
    clientSecret:
      name: copyparty-oidc-secret
    scopes: ["openid", "email", "profile", "groups", "offline_access"]
    redirectURL: https://copyparty.reyaan.dev/oauth2/callback
    logoutPath: /oauth2/sign_out
    cookieDomain: reyaan.dev
    refreshToken: true
    # store the access-token JWT in a named cookie so the jwt filter below can read it
    cookieNames:
      accessToken: copyparty-token
  jwt:
    providers:
      - name: pocketid
        issuer: https://id.reyaan.dev
        remoteJWKS:
          uri: https://id.reyaan.dev/.well-known/jwks.json
        # the token lives in the OIDC cookie, not the Authorization header
        extractFrom:
          cookies:
            - copyparty-token
        claimToHeaders:
          - claim: preferred_username
            header: x-idp-user
          - claim: groups
            header: x-idp-group
