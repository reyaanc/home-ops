---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: copyparty
spec:
  chartRef:
    kind: OCIRepository
    name: copyparty
  interval: 1h
  values:
    controllers:
      copyparty:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: copyparty/ac
              tag: latest
            env:
              PYTHONUNBUFFERED: "1"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3923
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
              limits:
                memory: 2Gi
    defaultPodOptions:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: copyparty
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.reyaan.dev"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: miroir-bulk
        accessMode: ReadWriteOnce
        size: 100Gi
        retain: true
        globalMounts:
          - path: /w
      hist:
        type: persistentVolumeClaim
        storageClass: miroir
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /hist
      config:
        type: configMap
        identifier: copyparty
        globalMounts:
          - path: /cfg/copyparty.conf
            subPath: copyparty.conf
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    configMaps:
      copyparty:
        data:
          copyparty.conf: |
            [global]
              e2dsa
              e2ts
              ansi
              grid
              hist: /hist/
              df: 16
              xff-src: 10.42.0.0/16
              rproxy: -1
              idp-h-usr: x-idp-user
              idp-h-grp: x-idp-group
              idp-store: 3
              idp-db: /w/.idp.db
              idp-adm: reyaan

            [/]
              /w

            [/${u}]
              /w/${u}
              accs:
                rwmda: ${u}

            [/shared]
              /w/shared
              accs:
                rwmd: @acct
