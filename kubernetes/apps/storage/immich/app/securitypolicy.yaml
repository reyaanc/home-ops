---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: frigate-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: frigate
  oidc:
    provider:
      issuer: https://id.reyaan.dev
    clientID: 1fb9df73-9855-47e1-814e-48345d1ba762
    clientSecret:
      name: frigate-oidc-secret
    scopes: ["openid", "email", "profile", "groups"]
    redirectURL: https://frigate.reyaan.dev/oauth2/callback
    logoutPath: /logout
    cookieDomain: reyaan.dev
