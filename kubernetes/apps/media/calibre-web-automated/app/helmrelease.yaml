---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web-automated
spec:
  chartRef:
    kind: OCIRepository
    name: calibre-web-automated
  interval: 1h
  values:
    controllers:
      calibre-web-automated:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: crocodilestick/calibre-web-automated
              tag: v4.0.6
            env:
              TZ: America/New_York
              PUID: 1000
              PGID: 1000
              CWA_PORT_OVERRIDE: &port 8083
              TRUSTED_PROXY_COUNT: "1"  # this is needed
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "calibre.reyaan.dev"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: miroir
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /config
      library:
        existingClaim: media
        globalMounts:
          - path: /calibre-library
            subPath: books
      ingest:
        existingClaim: media
        globalMounts:
          - path: /cwa-book-ingest
            subPath: books-ingest
