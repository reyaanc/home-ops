---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: bazarr-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bazarr
  oidc:
    provider:
      issuer: https://id.reyaan.dev
    clientID: db96fdd0-8a86-42bd-be6b-d5f757e18a7f
    clientSecret:
      name: bazarr-oidc-secret
    scopes: ["openid", "email", "profile", "groups"]
    redirectURL: https://bazarr.reyaan.dev/oauth2/callback
    logoutPath: /logout
    cookieDomain: reyaan.dev
