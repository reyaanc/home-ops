---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: radarr-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radarr
  oidc:
    provider:
      issuer: https://id.reyaan.dev
    clientID: cd22c51a-282e-4621-b049-de33967523db
    clientSecret:
      name: radarr-oidc-secret
    scopes: ["openid", "email", "profile", "groups"]
    redirectURL: https://radarr.reyaan.dev/oauth2/callback
    logoutPath: /logout
    cookieDomain: reyaan.dev
