---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prowlarr-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prowlarr
  oidc:
    provider:
      issuer: https://id.reyaan.dev
    clientID: 23e25d6c-d5b2-4a1c-a099-042fd96f98de
    clientSecret:
      name: prowlarr-oidc-secret
    scopes: ["openid", "email", "profile", "groups"]
    redirectURL: https://prowlarr.reyaan.dev/oauth2/callback
    logoutPath: /logout
    cookieDomain: reyaan.dev
