---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tinyauth
spec:
  chartRef:
    kind: OCIRepository
    name: tinyauth
  interval: 1h
  values:
    controllers:
      tinyauth:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/tinyauthapp/tinyauth
              tag: v5.1.3
            env:
              TZ: America/New_York
              TINYAUTH_APPURL: https://auth.reyaan.dev
              TINYAUTH_AUTH_SECURECOOKIE: "true"
              TINYAUTH_AUTH_TRUSTEDPROXIES: 10.42.0.0/16
              TINYAUTH_LABELPROVIDER: none
              TINYAUTH_DATABASE_PATH: /data/tinyauth.db
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME: Pocket ID
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL: https://id.reyaan.dev/authorize
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL: https://id.reyaan.dev/api/oidc/token
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL: https://id.reyaan.dev/api/oidc/userinfo
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL: https://auth.reyaan.dev/api/oauth/callback/pocketid
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES: openid email profile groups
              TINYAUTH_OAUTH_AUTOREDIRECT: pocketid
            envFrom:
              - secretRef:
                  name: tinyauth-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["tinyauth", "healthcheck"]
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 3000
    serviceMonitor:
      app:
        endpoints:
          - port: http
            path: /metrics
    route:
      app:
        hostnames:
          - "auth.reyaan.dev"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: miroir
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
