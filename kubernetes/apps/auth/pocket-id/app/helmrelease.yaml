---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
spec:
  chartRef:
    kind: OCIRepository
    name: pocket-id
  interval: 1h
  values:
    controllers:
      pocket-id:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.11.0
            env:
              TZ: America/New_York
              APP_URL: https://id.reyaan.dev
              TRUST_PROXY: "true"
            envFrom:
              - secretRef:
                  name: pocket-id-secret # ENCRYPTION_KEY (mandatory in v2), from the ExternalSecret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 1411
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 512Mi
    service:
      app:
        ports:
          app:
            port: 1411
    serviceMonitor:
      app:
        endpoints:
          - port: app
            path: /metrics
    route:
      app:
        hostnames:
          - "id.reyaan.dev"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /app/data
